[package]
name = "someda"
version = "0.3.0"
edition = "2021"
description = "Clean-room KiCad-compatible EDA core with AI orchestration: s-expression board model, DRC/ERC engines, net classes, verify-before-done repair loop, LLM gateway, and kicad-cli integration"
license = "MIT"
repository = "https://github.com/kabidey/someda"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true